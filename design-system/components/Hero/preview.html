<!-- @dsCard group="Content" height=440 width=1100 subtitle="Hero đầu trang với khối cam" -->
<div class="lm" style="padding:24px;background:var(--surface)">
  <section class="lm-hero">
    <div>
      <p class="lm-hero__overline">Ưu đãi tháng 11</p>
      <h1 class="lm-hero__title">Mạng nhanh, <em>sống chất.</em></h1>
      <p class="lm-hero__lead">Internet 1Gbps cho cả nhà, lắp đặt trong 24 giờ.</p>
      <div class="lm-hero__ctas"><a class="lm-btn lm-btn--lg" href="#">Đăng ký ngay</a><a class="lm-btn lm-btn--lg lm-btn--secondary" href="#">Xem gói cước</a></div>
    </div>
    <div class="lm-hero__media" aria-hidden="true">
      <div style="position:absolute;right:0;top:0;width:72%;aspect-ratio:1;max-width:100%;border-radius:50%;background:var(--brand)"></div>
      <div style="position:absolute;left:4%;bottom:0;width:44%;aspect-ratio:1;max-width:100%;border-radius:var(--radius-xl);background:var(--surface-raised);box-shadow:var(--shadow-card-hover);display:grid;place-content:center;text-align:center">
        <span style="font-size:40px;line-height:44px;font-weight:800;letter-spacing:-1px">1Gbps</span>
        <span style="font-size:12px;font-weight:600;color:var(--ink-secondary)">tốc độ tối đa</span>
      </div>
      <div style="position:absolute;right:6%;bottom:8%;width:22%;aspect-ratio:2.4;border-radius:var(--radius-pill);background:var(--brand-soft)"></div>
    </div>
  </section>
</div>
<script>document.querySelectorAll('a[href="#"]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()))</script>
