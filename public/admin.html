<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị – Vòng quay may mắn</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="token.css">
  <style>
    body { background: var(--cream-100); color: var(--ink); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: var(--space-lg) var(--gutter) var(--space-xxl); }
    header { display: flex; flex-wrap: wrap; gap: var(--space-sm); align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); }
    header .brand { display: flex; align-items: center; gap: var(--space-sm); }
    header img { width: 48px; }
    h1 { margin: 0; font-family: var(--font-display); font-size: 26px; color: var(--orange-700); line-height: 1.1; }
    h2 { margin: 0 0 var(--space-md); font-family: var(--font-display); font-size: 20px; color: var(--orange-700); }
    .muted { color: var(--muted); font-size: var(--fs-caption); }
    .card { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); box-shadow: var(--shadow-card); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 20px; border-radius: var(--radius-pill); border: 0; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--grad-voucher); color: var(--orange-800); box-shadow: var(--shadow-button); }
    .btn-primary:active { transform: translateY(3px); box-shadow: var(--shadow-button-pressed); }
    .btn-primary:disabled { background: var(--cream-200); color: var(--muted); box-shadow: none; cursor: not-allowed; }
    .btn-ghost { background: var(--white); color: var(--orange-700); border: 2px solid var(--orange-500); }
    input, select { font: inherit; font-size: 16px; height: 44px; padding: 0 12px; border: 2px solid var(--hairline); border-radius: var(--radius-md); background: var(--white); color: var(--ink); }
    input:focus, select:focus { outline: none; border-color: var(--orange-500); box-shadow: var(--ring-focus); }
    .alert { padding: var(--space-sm) var(--space-md); border-radius: var(--radius-md); font-weight: 600; margin-top: var(--space-sm); }
    .alert.err { background: var(--error-bg); color: var(--error); }
    .alert.ok { background: #E8F6EB; color: var(--success); }
    #login { max-width: 420px; margin: 10vh auto; }
    #login form { display: flex; gap: var(--space-xs); }
    #login input { flex: 1; min-width: 0; }

    .stock-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--space-md); }
    .stock-item { border: 2px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-md); }
    .stock-item label { display: block; font-weight: 700; margin-bottom: var(--space-xs); }
    .stock-item input { width: 100%; }
    .stock-meta { margin-top: var(--space-xs); font-size: 15px; }
    .tag-out { display: inline-block; margin-top: var(--space-xs); background: var(--error-bg); color: var(--error); font-weight: 700; font-size: var(--fs-caption); border-radius: var(--radius-pill); padding: 2px 10px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-sm); margin-bottom: var(--space-lg); }
    .tile { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius-md); padding: var(--space-sm) var(--space-md); }
    .tile .l { color: var(--muted); font-size: var(--fs-caption); }
    .tile .v { font-family: var(--font-display); font-size: 30px; font-weight: 800; color: var(--orange-700); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile .s { color: var(--muted); font-size: 12px; }

    .tbl-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); text-align: left; white-space: nowrap; }
    th { background: var(--cream-50); color: var(--body); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; }
    td.num, th.num { text-align: right; }
    tr.total td { font-weight: 700; background: var(--cream-50); }
    .pill { display: inline-block; border-radius: var(--radius-pill); padding: 2px 10px; font-size: 12px; font-weight: 700; background: var(--cream-100); color: var(--orange-800); }
    .pill.gift { background: var(--orange-500); color: var(--white); }
    .filters { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-bottom: var(--space-sm); }
    .filters input[type=search] { flex: 1 1 220px; }
    .empty { text-align: center; color: var(--muted); padding: var(--space-lg); }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Đăng nhập -->
    <section id="login" class="card">
      <h2>Quản trị vòng quay</h2>
      <p class="muted">Nhập key quản trị để vào.</p>
      <form id="login-form">
        <input type="password" id="key" autocomplete="current-password" placeholder="Key quản trị" required>
        <button class="btn btn-primary" type="submit">Vào</button>
      </form>
      <div id="login-alert" class="alert err" hidden></div>
    </section>

    <!-- Trang chính -->
    <div id="app" hidden>
      <header>
        <div class="brand">
          <img src="assets/logo-ftel.png" alt="FPT Telecom">
          <div>
            <h1>Vòng quay may mắn – Quản trị</h1>
            <div class="muted" id="updated"></div>
          </div>
        </div>
        <div class="filters" style="margin:0">
          <button class="btn btn-ghost" id="btn-reload" type="button">↻ Tải lại</button>
          <a class="btn btn-primary" id="btn-csv" href="#">⤓ Tải CSV</a>
          <button class="btn btn-ghost" id="btn-logout" type="button">Thoát</button>
        </div>
      </header>

      <section class="card">
        <h2>Số lượng quà hiện vật</h2>
        <form id="stock-form">
          <div class="stock-grid">
            <div class="stock-item">
              <label for="s-MOCKHOA">Móc khoá – tổng số lượng</label>
              <input id="s-MOCKHOA" type="number" inputmode="numeric" min="0" step="1">
              <div class="stock-meta" id="m-MOCKHOA"></div>
            </div>
            <div class="stock-item">
              <label for="s-NON">Nón – tổng số lượng</label>
              <input id="s-NON" type="number" inputmode="numeric" min="0" step="1">
              <div class="stock-meta" id="m-NON"></div>
            </div>
            <div class="stock-item">
              <label for="s-BINHNUOC">Bình nước – tổng số lượng</label>
              <input id="s-BINHNUOC" type="number" inputmode="numeric" min="0" step="1">
              <div class="stock-meta" id="m-BINHNUOC"></div>
            </div>
            <div class="stock-item">
              <label for="s-TUI">Túi – tổng số lượng</label>
              <input id="s-TUI" type="number" inputmode="numeric" min="0" step="1">
              <div class="stock-meta" id="m-TUI"></div>
            </div>
          </div>
          <div style="margin-top:var(--space-md)">
            <button class="btn btn-primary" type="submit" id="btn-save-stock">Lưu</button>
          </div>
          <div id="stock-alert" class="alert" hidden></div>
        </form>
      </section>

      <div class="tiles" id="tiles"></div>

      <section class="card">
        <h2>Quà đã phát theo khu vực</h2>
        <div class="tbl-wrap"><table id="tbl-area"></table></div>
      </section>

      <section class="card">
        <h2>Tỉ lệ thực tế so với cấu hình</h2>
        <div class="tbl-wrap"><table id="tbl-rate"></table></div>
        <p class="muted" id="swapped"></p>
      </section>

      <section class="card">
        <h2>Theo ngày</h2>
        <div class="tbl-wrap"><table id="tbl-day"></table></div>
      </section>

      <section class="card">
        <h2>Danh sách người trúng</h2>
        <div class="filters">
          <input type="search" id="q" placeholder="Tìm SĐT hoặc mã nhận quà…">
          <select id="f-area"><option value="">Tất cả khu vực</option></select>
          <select id="f-prize"><option value="">Tất cả quà</option></select>
          <input type="date" id="f-day" aria-label="Lọc theo ngày">
        </div>
        <div class="muted" id="count"></div>
        <div class="tbl-wrap">
          <table id="tbl-list">
            <thead><tr><th>Thời gian</th><th>Họ tên</th><th>SĐT</th><th>Khu vực</th><th>Quà</th><th>Mã nhận quà</th><th>Nguồn</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
  (() => {
    "use strict";
    // Phải giống API_BASE trong game.js ("/api" = Worker cùng domain)
    const API_BASE = "/api";

    const PRIZES = [
      { code: "V150", name: "Voucher 150.000đ", gift: false },
      { code: "MOCKHOA", name: "Móc khoá", gift: true },
      { code: "V200", name: "Voucher 200.000đ", gift: false },
      { code: "NON", name: "Nón", gift: true },
      { code: "V300", name: "Voucher 300.000đ", gift: false },
      { code: "BINHNUOC", name: "Bình nước", gift: true },
      { code: "TUI", name: "Túi", gift: true },
    ];
    const GIFT_CODES = PRIZES.filter((p) => p.gift).map((p) => p.code);
    const ORDER = ["V150", "V200", "V300", ...GIFT_CODES]; // thứ tự cột hiển thị
    const AREAS = ["Tân Bình", "Quận 4", "Quận 6", "Khác"]; // "Khác": danh sách hiện thêm nội dung tự nhập
    const $ = (s) => document.querySelector(s);
    const pname = (c) => (PRIZES.find((p) => p.code === c) || { name: c }).name;
    const num = (n) => Number(n || 0).toLocaleString("vi-VN");
    const pct = (x) => (x * 100).toLocaleString("vi-VN", { maximumFractionDigits: 1 }) + "%";
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const base = () => API_BASE.replace(/\/+$/, "");
    let KEY = "";
    try { KEY = sessionStorage.getItem("vq2_admin_key") || ""; } catch {}

    async function get(qs) {
      const r = await fetch(base() + qs + (qs.includes("?") ? "&" : "?") + "key=" + encodeURIComponent(KEY));
      const d = await r.json().catch(() => null);
      if (!d) throw new Error("Không đọc được dữ liệu từ server");
      if (r.status === 403) { const e = new Error(d.message || "Sai key"); e.auth = true; throw e; }
      if (d.result !== "ok") throw new Error(d.message || "Lỗi server");
      return d;
    }

    function showAlert(el, msg, ok) {
      el.textContent = msg; el.hidden = !msg;
      el.className = "alert " + (ok ? "ok" : "err");
    }

    // ----- Đăng nhập -----
    $("#login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      KEY = $("#key").value.trim();
      await load(true);
    });
    $("#btn-logout").addEventListener("click", () => {
      KEY = ""; try { sessionStorage.removeItem("vq2_admin_key"); } catch {}
      $("#app").hidden = true; $("#login").hidden = false; $("#key").value = "";
    });
    $("#btn-reload").addEventListener("click", () => load(false));

    async function load(fromLogin) {
      if (!API_BASE) {
        showAlert($("#login-alert"), "Chưa cấu hình API_BASE (URL Worker) trong admin.html.");
        return;
      }
      try {
        const [sum, list] = await Promise.all([get("/?action=summary"), get("/?action=list")]);
        try { sessionStorage.setItem("vq2_admin_key", KEY); } catch {}
        $("#login").hidden = true; $("#app").hidden = false;
        $("#btn-csv").href = base() + "/?action=export&key=" + encodeURIComponent(KEY);
        renderSummary(sum);
        renderList(list.rows || []);
      } catch (err) {
        if (err.auth || fromLogin) {
          $("#app").hidden = true; $("#login").hidden = false;
          showAlert($("#login-alert"), err.auth ? "Sai key quản trị." : "Không kết nối được server: " + err.message);
        } else {
          alert("Không tải được dữ liệu: " + err.message);
        }
      }
    }

    // ----- Tồn kho -----
    function renderStock(stock) {
      for (const code of GIFT_CODES) {
        const s = stock[code] || { total: 0, used: 0, remaining: 0 };
        $("#s-" + code).value = s.total;
        $("#s-" + code).min = s.used;
        $("#m-" + code).innerHTML = `Đã phát: <b>${num(s.used)}</b> · Còn lại: <b>${num(s.remaining)}</b>` +
          (s.remaining === 0 ? `<br><span class="tag-out">Đã hết – đang đổi sang voucher</span>` : "");
      }
    }

    $("#stock-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = { key: KEY };
      for (const code of GIFT_CODES) {
        const v = $("#s-" + code).value.trim();
        if (v === "") continue;
        const n = Number(v);
        if (!Number.isInteger(n) || n < 0) { showAlert($("#stock-alert"), `Số lượng ${pname(code)} phải là số nguyên ≥ 0`); return; }
        if (n < Number($("#s-" + code).min || 0)) { showAlert($("#stock-alert"), `${pname(code)}: đã phát ${$("#s-" + code).min}, không thể nhập nhỏ hơn số này`); return; }
        body[code] = n;
      }
      const btn = $("#btn-save-stock");
      btn.disabled = true;
      try {
        const r = await fetch(base() + "/admin/stock", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
        const d = await r.json().catch(() => null);
        if (!d || d.result !== "ok") throw new Error((d && d.message) || "Lưu không thành công");
        renderStock(d.stock);
        showAlert($("#stock-alert"), "Đã lưu số lượng quà.", true);
      } catch (err) {
        showAlert($("#stock-alert"), err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // ----- Thống kê -----
    function renderSummary(s) {
      $("#updated").textContent = "Cập nhật lúc " + s.now + (s.open ? "" : " · Chương trình đang KHOÁ");
      renderStock(s.stock);
      const count = (c) => (s.prizes.find((p) => p.code === c) || {}).count || 0;
      const vouchers = count("V150") + count("V200") + count("V300");
      const tile = (l, v, sub) => `<div class="tile"><div class="l">${esc(l)}</div><div class="v">${esc(v)}</div><div class="s">${esc(sub || "")}</div></div>`;
      $("#tiles").innerHTML =
        tile("Tổng lượt chơi", num(s.total)) +
        tile("Voucher giấy đã phát", num(vouchers), `150k: ${num(count("V150"))} · 200k: ${num(count("V200"))} · 300k: ${num(count("V300"))}`) +
        GIFT_CODES.map((c) => tile(pname(c) + " đã phát", num(count(c)), "Còn lại: " + num((s.stock[c] || {}).remaining))).join("");

      const head = `<thead><tr><th>Khu vực</th>${ORDER.map((c) => `<th class="num">${esc(pname(c))}</th>`).join("")}<th class="num">Tổng</th></tr></thead>`;
      const rows = s.areas.map((a) => `<tr><td>${esc(a.area)}</td>${ORDER.map((c) => `<td class="num">${num(a.counts[c])}</td>`).join("")}<td class="num"><b>${num(a.total)}</b></td></tr>`).join("");
      const tot = `<tr class="total"><td>Tổng</td>${ORDER.map((c) => `<td class="num">${num(count(c))}</td>`).join("")}<td class="num">${num(s.total)}</td></tr>`;
      $("#tbl-area").innerHTML = head + "<tbody>" + rows + tot + "</tbody>";

      $("#tbl-rate").innerHTML = `<thead><tr><th>Quà</th><th class="num">Đã phát</th><th class="num">Tỉ lệ cấu hình</th><th class="num">Tỉ lệ thực tế</th></tr></thead><tbody>` +
        ORDER.map((c) => { const p = s.prizes.find((x) => x.code === c); return `<tr><td>${esc(p.name)}</td><td class="num">${num(p.count)}</td><td class="num">${pct(p.config_rate)}</td><td class="num">${pct(p.actual_rate)}</td></tr>`; }).join("") + "</tbody>";
      $("#swapped").textContent = s.swapped_to_voucher ? `${num(s.swapped_to_voucher)} lượt quay trúng quà hiện vật nhưng đã hết hàng → được đổi sang voucher (tỉ lệ thực tế vì vậy lệch so với cấu hình).` : "";

      $("#tbl-day").innerHTML = `<thead><tr><th>Ngày</th>${ORDER.map((c) => `<th class="num">${esc(pname(c))}</th>`).join("")}<th class="num">Tổng</th></tr></thead><tbody>` +
        (s.days.length ? s.days.map((d) => `<tr><td>${esc(d.day.split("-").reverse().join("/"))}</td>${ORDER.map((c) => `<td class="num">${num(d.counts[c])}</td>`).join("")}<td class="num"><b>${num(d.total)}</b></td></tr>`).join("")
          : `<tr><td colspan="${ORDER.length + 2}" class="empty">Chưa có lượt chơi</td></tr>`) + "</tbody>";
    }

    // ----- Danh sách -----
    let ROWS = [];
    AREAS.forEach((a) => $("#f-area").insertAdjacentHTML("beforeend", `<option>${esc(a)}</option>`));
    ORDER.forEach((c) => $("#f-prize").insertAdjacentHTML("beforeend", `<option value="${c}">${esc(pname(c))}</option>`));
    ["#q", "#f-area", "#f-prize", "#f-day"].forEach((s) => $(s).addEventListener("input", applyFilter));

    function renderList(rows) {
      ROWS = rows;
      $("#tbl-list tbody").innerHTML = rows.map((r, i) => {
        const swapped = r.rolled_code && r.rolled_code !== r.prize_code ? ` <span class="muted">(quay ra ${esc(pname(r.rolled_code))})</span>` : "";
        const gift = GIFT_CODES.includes(r.prize_code);
        return `<tr data-i="${i}"><td>${esc(r.created_at)}</td><td>${esc(r.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.area)}${r.area === "Khác" && r.area_other ? ": " + esc(r.area_other) : ""}</td>` +
          `<td><span class="pill${gift ? " gift" : ""}">${esc(r.prize_name)}</span>${swapped}</td><td><b>${esc(r.claim_code)}</b></td><td>${esc(r.src)}</td></tr>`;
      }).join("") || `<tr><td colspan="7" class="empty">Chưa có lượt chơi</td></tr>`;
      applyFilter();
    }

    function applyFilter() {
      const q = $("#q").value.trim().toUpperCase().replace(/\s+/g, "");
      const area = $("#f-area").value, prize = $("#f-prize").value, day = $("#f-day").value;
      let n = 0;
      document.querySelectorAll("#tbl-list tbody tr[data-i]").forEach((tr) => {
        const r = ROWS[tr.dataset.i];
        const show = (!q || r.phone.includes(q) || r.claim_code.toUpperCase().includes(q)) &&
          (!area || r.area === area) && (!prize || r.prize_code === prize) && (!day || r.day === day);
        tr.hidden = !show; if (show) n++;
      });
      $("#count").textContent = `Đang hiển thị ${num(n)} / ${num(ROWS.length)} lượt`;
    }

    if (KEY) load(false).catch(() => {});
  })();
  </script>
</body>
</html>
