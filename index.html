<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c9792e">
<title>Đua Thú Cao Bồi - FPT</title>
<style>
  :root{
    --fpt-orange:#F37021;
    --fpt-orange-2:#ff8c3a;
    --fpt-blue:#0a6cff;
    --fpt-green:#36b37e;
    --ink:#3a2410;
    --sand:#e9c892;
    --sand-d:#d4a85f;
    --wood:#7a4a24;
    --wood-d:#5a3418;
    --sky:#8fd0e8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  html,body{height:100%;}
  body{
    background:linear-gradient(180deg,#9ad7ee 0%,#bfe3f2 30%,#e9c892 55%,#d4a85f 100%);
    color:var(--ink);overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;min-height:100dvh;padding:14px;
  }
  /* desert sun + clouds */
  .bg-deco{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .sun{position:absolute;top:6%;right:12%;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle,#fff3c4,#ffd86b);box-shadow:0 0 50px #ffd86b;}
  .cloud{position:absolute;color:#fff;opacity:.85;font-size:40px;animation:drift linear infinite;}
  @keyframes drift{from{transform:translateX(-120px);}to{transform:translateX(120vw);}}

  .stage{position:relative;z-index:2;width:100%;max-width:440px;}

  /* ===== HEADER ===== */
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px;}
  .brand .logo{height:52px;width:auto;display:block;background:#fff;padding:8px 16px;
    border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.3);}
  .brand .tag{font-size:17px;font-weight:800;letter-spacing:.5px;color:#fff;
    text-shadow:0 2px 0 var(--wood-d),0 3px 8px rgba(0,0,0,.35);}

  .card{
    background:rgba(255,250,240,.92);border:3px solid var(--wood);border-radius:22px;
    padding:20px 18px;box-shadow:0 16px 40px rgba(90,52,24,.4);animation:pop .4s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:none;}}
  .hidden{display:none!important;}

  /* ===== FORM ===== */
  .f-emoji{font-size:48px;text-align:center;margin-bottom:6px;animation:bob 2.2s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-8px);}}
  .f-title{font-size:22px;font-weight:800;text-align:center;line-height:1.3;margin-bottom:4px;color:var(--wood-d);}
  .f-sub{font-size:13.5px;text-align:center;opacity:.85;margin-bottom:18px;line-height:1.5;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--wood-d);}
  .field input{width:100%;padding:14px 15px;border-radius:13px;border:2px solid var(--sand-d);
    background:#fff;color:var(--ink);font-size:16px;font-weight:600;outline:none;transition:.2s;}
  .field input:focus{border-color:var(--fpt-orange);box-shadow:0 0 0 4px rgba(243,112,33,.22);}
  .field input.err{border-color:#e23b3b;box-shadow:0 0 0 4px rgba(226,59,59,.18);}
  .err-msg{color:#c62828;font-size:12px;margin-top:5px;min-height:14px;display:block;font-weight:600;}

  .btn{width:100%;border:none;border-radius:15px;padding:16px;font-size:17px;font-weight:800;
    color:#fff;cursor:pointer;transition:transform .12s,box-shadow .2s;letter-spacing:.4px;
    background:linear-gradient(135deg,var(--fpt-orange),var(--fpt-orange-2));
    box-shadow:0 8px 20px rgba(243,112,33,.5),inset 0 -3px 0 rgba(0,0,0,.15);
    text-shadow:0 1px 2px rgba(0,0,0,.25);}
  .btn:active{transform:scale(.96);}
  .btn:disabled{opacity:.55;cursor:not-allowed;filter:grayscale(.3);}
  .btn.ghost{background:var(--wood);box-shadow:0 6px 16px rgba(90,52,24,.4);}

  /* ===== GAME ===== */
  .greet{text-align:center;font-size:14px;margin-bottom:10px;color:var(--wood-d);font-weight:600;}
  .greet b{color:var(--fpt-orange);}
  .pick-title{text-align:center;font-size:14px;font-weight:800;color:var(--wood-d);margin-bottom:10px;}
  .pick-title span{color:var(--fpt-orange);}

  /* racer picker */
  .pickers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:14px;}
  .pk{position:relative;background:#fff;border:2.5px solid var(--sand-d);border-radius:14px;
    padding:8px 2px 6px;text-align:center;cursor:pointer;transition:.15s;}
  .pk .num{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
    width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.25);}
  .pk .ani{font-size:30px;line-height:1;display:block;margin-top:6px;}
  .pk.sel{border-color:var(--fpt-orange);background:#fff3e6;transform:translateY(-3px);
    box-shadow:0 8px 16px rgba(243,112,33,.35);}
  .pk.sel::after{content:"✓";position:absolute;bottom:2px;right:5px;color:var(--fpt-green);font-weight:900;font-size:13px;}

  /* race track */
  .track{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--wood);
    background:linear-gradient(180deg,#f0d9a8,#e4c07f);margin-bottom:12px;
    box-shadow:inset 0 2px 8px rgba(90,52,24,.25);}
  .lane{position:relative;height:46px;border-bottom:2px dashed rgba(122,74,36,.3);}
  .lane:last-child{border-bottom:none;}
  .lane:nth-child(odd){background:rgba(255,255,255,.12);}
  .lane .lnum{position:absolute;left:6px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;z-index:3;
    display:flex;align-items:center;justify-content:center;opacity:.9;}
  .racer{position:absolute;left:0;top:50%;transform:translate(0,-50%);font-size:30px;z-index:2;
    will-change:transform;}
  .racer.run{animation:gallop .28s ease-in-out infinite;}
  @keyframes gallop{50%{transform:translate(0,-62%) rotate(-4deg);}}
  .finish{position:absolute;top:0;right:8px;width:14px;height:100%;z-index:1;
    background:repeating-linear-gradient(45deg,#2b2b2b 0 6px,#fff 6px 12px);opacity:.85;}
  .flag{position:absolute;top:-2px;right:4px;font-size:20px;z-index:4;}

  .controls{margin-top:4px;}
  .hint{text-align:center;font-size:12.5px;opacity:.8;margin-top:9px;color:var(--wood-d);font-weight:600;}

  /* ===== RESULT ===== */
  .overlay{position:fixed;inset:0;z-index:50;background:rgba(58,36,16,.82);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;}}
  .result{width:100%;max-width:360px;text-align:center;background:linear-gradient(180deg,#fffdf8,#fff2e0);
    color:var(--ink);border-radius:24px;padding:28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.5);
    animation:pop .4s ease;position:relative;overflow:hidden;border:3px solid var(--wood);}
  .result.win{border-color:var(--fpt-orange);}
  .r-emoji{font-size:62px;margin-bottom:8px;animation:bob 1.8s ease-in-out infinite;}
  .r-title{font-size:23px;font-weight:800;margin-bottom:6px;color:var(--wood-d);}
  .result.win .r-title{color:var(--fpt-orange);}
  .r-desc{font-size:14.5px;line-height:1.55;opacity:.88;margin-bottom:20px;}
  .r-desc b{color:var(--fpt-orange);}

  .loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0;}
  .spinner{width:52px;height:52px;border-radius:50%;border:5px solid rgba(243,112,33,.2);
    border-top-color:var(--fpt-orange);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loader p{font-size:14px;font-weight:700;color:var(--wood-d);}

  .confetti{position:absolute;top:-10px;width:9px;height:14px;opacity:.9;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(420px) rotate(540deg);opacity:0;}}

  .footer{text-align:center;font-size:11px;color:var(--wood-d);opacity:.7;margin-top:14px;font-weight:600;}
</style>
</head>

    <span class="tag">🤠 ĐUA THÚ CAO BỒI 🐂</span>
  </div>

  <!-- ===== SCREEN 1: FORM ===== -->
  <div class="card" id="screenForm">
    <div class="f-emoji">🏇</div>
    <div class="f-title">Vào Trường Đua Cùng FPT!</div>
    <div class="f-sub">Để lại thông tin, chọn chú thú của bạn và xem ai về nhất để rinh quà từ FPT Telecom.</div>

    <div class="field">
      <label for="name">Họ và tên</label>
      <input type="text" id="name" placeholder="Nguyễn Văn A" autocomplete="name">
      <span class="err-msg" id="errName"></span>
    </div>
    <div class="field">
      <label for="phone">Số điện thoại</label>
      <input type="tel" id="phone" placeholder="VD: 0912345678" inputmode="numeric" maxlength="10" autocomplete="tel">
      <span class="err-msg" id="errPhone"></span>
    </div>

    <button class="btn" id="btnStart">Vào trường đua 🤠</button>
  </div>

  <!-- ===== SCREEN 2: GAME ===== -->
  <div class="card hidden" id="screenGame">
    <div class="greet">Cao bồi <b id="hiName">bạn</b> ơi, chọn chú thú để đặt cược! 🍀</div>
    <div class="pick-title">Chọn chú thú bạn tin sẽ <span>VỀ NHẤT</span>:</div>
    <div class="pickers" id="pickers"></div>

    <div class="track" id="track"></div>

    <div class="controls">
      <button class="btn" id="btnRace" disabled>🏁 BẮT ĐẦU ĐUA</button>
      <div class="hint" id="hint">Hãy chọn 1 chú thú ở trên trước nhé</div>
    </div>
  </div>

  <div class="footer">© FPT Telecom · fpt.vn</div>
</div>

<!-- ===== RESULT OVERLAY ===== -->
<div class="overlay hidden" id="overlay">
  <div class="result" id="resultBox"></div>
</div>

<script>
/* ============ CONFIG ============ */
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxB9cVjtVvnGHymOtzSroTdXvplM9wTXKHQbrLm8r9kxezdhDwxP2Kq0T-SSZ2LE4XJ/exec";
const WIN_RATE = 0.30;
const REWARD_WIN  = "Bạn nhận được 1 phần quà từ FPT";
const REWARD_MISS = "Chúc may mắn lần sau";

const RACERS = [
  { ani:"🐂", color:"#c0392b", name:"Bò Tót Đỏ" },
  { ani:"🐄", color:"#d4a017", name:"Bò Sữa" },
  { ani:"🐎", color:"#2e86de", name:"Ngựa Chiến" },
  { ani:"🐷", color:"#e056a0", name:"Heo Hồng" },
  { ani:"🐏", color:"#27ae60", name:"Cừu Xanh" }
];

/* ============ STATE ============ */
let player = { name:"", phone:"" };
let picked = -1;
let racing = false;

/* ============ ELEMENTS ============ */
const $ = id => document.getElementById(id);
const screenForm=$("screenForm"), screenGame=$("screenGame");
const nameInput=$("name"), phoneInput=$("phone");
const errName=$("errName"), errPhone=$("errPhone");
const overlay=$("overlay"), resultBox=$("resultBox");
const pickers=$("pickers"), track=$("track");

/* ============ BUILD PICKERS + TRACK ============ */
RACERS.forEach((r,i)=>{
  const pk=document.createElement("div");
  pk.className="pk"; pk.dataset.i=i;
  pk.innerHTML=`<span class="num" style="background:${r.color}">${i+1}</span><span class="ani">${r.ani}</span>`;
  pk.addEventListener("click",()=>selectRacer(i));
  pickers.appendChild(pk);

  const lane=document.createElement("div");
  lane.className="lane";
  lane.innerHTML=`<span class="lnum" style="background:${r.color}">${i+1}</span>
    <span class="racer" id="racer${i}" style="left:34px">${r.ani}</span>`;
  track.appendChild(lane);
});
track.insertAdjacentHTML("beforeend",'<div class="finish"></div><div class="flag">🏁</div>');

function selectRacer(i){
  if(racing) return;
  picked=i;
  document.querySelectorAll(".pk").forEach(el=>el.classList.toggle("sel",+el.dataset.i===i));
  $("btnRace").disabled=false;
  $("hint").textContent=`Bạn chọn số ${i+1} — ${RACERS[i].name}. Bấm ĐUA để bắt đầu!`;
}

/* ============ VALIDATION ============ */
const PHONE_RE=/^(0)(3[2-9]|5[25689]|7[06-9]|8[1-9]|9[0-9])[0-9]{7}$/;
phoneInput.addEventListener("input",e=>{e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);});

function validate(){
  let ok=true;
  const name=nameInput.value.trim(), phone=phoneInput.value.trim();
  errName.textContent=""; errPhone.textContent="";
  nameInput.classList.remove("err"); phoneInput.classList.remove("err");
  if(name.length<2){errName.textContent="Vui lòng nhập họ tên hợp lệ.";nameInput.classList.add("err");ok=false;}
  if(!/^0\d{9}$/.test(phone)){errPhone.textContent="Số điện thoại phải gồm đúng 10 chữ số.";phoneInput.classList.add("err");ok=false;}
  else if(!PHONE_RE.test(phone)){errPhone.textContent="Số điện thoại không đúng định dạng nhà mạng Việt Nam.";phoneInput.classList.add("err");ok=false;}
  return ok;
}

/* ============ START ============ */
$("btnStart").addEventListener("click",()=>{
  if(!validate()) return;
  player.name=nameInput.value.trim();
  player.phone=phoneInput.value.trim();
  $("hiName").textContent=player.name;
  screenForm.classList.add("hidden");
  screenGame.classList.remove("hidden");
});

/* ============ RACE ============ */
$("btnRace").addEventListener("click",startRace);

function startRace(){
  if(racing || picked<0) return;
  racing=true;
  $("btnRace").disabled=true;
  document.querySelectorAll(".pk").forEach(el=>el.style.pointerEvents="none");
  $("hint").textContent="Các chú thú đang phi nước đại... 💨";

  const isWin = Math.random() < WIN_RATE;
  // winner lane: player's pick if win, else a random other racer
  let winner = picked;
  if(!isWin){
    const others=RACERS.map((_,i)=>i).filter(i=>i!==picked);
    winner=others[Math.floor(Math.random()*others.length)];
  }

  const lane0=track.querySelector(".lane");
  const trackW = track.clientWidth;
  const startX = 34;
  const finishX = trackW - 44;          // stop point (before flag)
  const range = finishX - startX;

  const pos = RACERS.map(()=>0);        // 0..1 progress
  const base = RACERS.map(()=> 0.0055 + Math.random()*0.0025);
  base[winner] += 0.0022;               // winner a touch faster
  const els = RACERS.map((_,i)=>$("racer"+i));
  els.forEach(e=>e.classList.add("run"));

  const timer=setInterval(()=>{
    for(let i=0;i<RACERS.length;i++){
      if(pos[i]>=1) continue;
      pos[i] += base[i]*(0.55+Math.random()*0.9);   // jitter -> lead changes
      // keep non-winners from crossing before the winner
      if(i!==winner && pos[i]>0.94 && pos[winner]<1) pos[i]=0.94;
      if(pos[i]>1) pos[i]=1;
      els[i].style.transform=`translate(${pos[i]*range}px,-50%)`;
    }
    if(pos[winner]>=1){
      clearInterval(timer);
      els.forEach(e=>e.classList.remove("run"));
      setTimeout(()=>finishRace(isWin,winner),500);
    }
  },30);
}

/* ============ FINISH -> SEND -> RESULT ============ */
function finishRace(isWin,winner){
  const reward=isWin?REWARD_WIN:REWARD_MISS;
  overlay.classList.remove("hidden");
  resultBox.className="result";
  resultBox.innerHTML=`<div class="loader"><div class="spinner"></div><p>Đang ghi nhận kết quả...</p></div>`;
  sendToSheet(player.name,player.phone,reward).finally(()=>showResult(isWin,winner,reward));
}

/* ============ SEND DATA (CORS-safe) ============ */
function sendToSheet(name,phone,reward){
  return fetch(WEBHOOK_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({name,phone,reward})
  }).then(r=>r.text()).catch(err=>{console.warn("Gửi dữ liệu lỗi:",err);});
}

/* ============ RESULT ============ */
function showResult(isWin,winner,reward){
  const w=RACERS[winner];
  if(isWin){
    resultBox.className="result win";
    resultBox.innerHTML=`
      <div class="r-emoji">🎉</div>
      <div class="r-title">Về nhất rồi!</div>
      <div class="r-desc">Chú ${w.ani} số <b>${winner+1}</b> bạn chọn đã cán đích đầu tiên!<br><b>${reward}</b>.<br>FPT sẽ liên hệ số <b>${player.phone}</b> để trao quà. 💛</div>
      <button class="btn" id="btnClose">Tuyệt vời 🎊</button>`;
    confettiBurst();
  }else{
    resultBox.className="result";
    resultBox.innerHTML=`
      <div class="r-emoji">😅</div>
      <div class="r-title">Hụt mất rồi!</div>
      <div class="r-desc">Lần này chú ${w.ani} số <b>${winner+1}</b> về nhất. ${reward}!<br>Thông tin của bạn đã được ghi nhận — theo dõi FPT để có thêm cơ hội nhé!</div>
      <button class="btn ghost" id="btnClose">Đóng</button>`;
  }
  $("btnClose").addEventListener("click",()=>overlay.classList.add("hidden"));
}

/* ============ CONFETTI ============ */
function confettiBurst(){
  const colors=["#F37021","#0a6cff","#36b37e","#ffd56b","#ff5a8a","#7a5cff"];
  for(let i=0;i<60;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"%";
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(1.4+Math.random()*1.4)+"s";
    c.style.animationDelay=(Math.random()*.4)+"s";
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    if(Math.random()>.5) c.style.borderRadius="50%";
    resultBox.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}
</script>
