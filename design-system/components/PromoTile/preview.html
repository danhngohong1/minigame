<!-- @dsCard group="Content" height=380 subtitle="Light, alt and dark tiles on the 12px grid" -->
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--space-3);background:var(--surface)">
  <section class="lm-tile lm-tile--alt" style="min-height:360px">
    <h3 class="lm-tile__headline">Studio Display</h3>
    <p class="lm-tile__subhead">Bright ideas, brighter screen.</p>
    <div class="lm-tile__ctas"><a class="lm-btn" href="#">Learn more</a><a class="lm-btn lm-btn--secondary" href="#">Buy</a></div>
    <div class="lm-tile__media" aria-hidden="true" style="display:flex;align-items:flex-end;justify-content:center"><div style="width:64%;aspect-ratio:16/10;max-width:100%;background:var(--ink);border-radius:8px 8px 0 0"></div></div>
  </section>
  <section class="lm-tile lm-tile--dark" style="min-height:360px">
    <h3 class="lm-tile__headline">Pro, further.</h3>
    <p class="lm-tile__subhead">Our fastest chip yet.</p>
    <div class="lm-tile__ctas"><a class="lm-btn" href="#">Learn more</a><a class="lm-btn lm-btn--secondary" href="#">Buy</a></div>
    <div class="lm-tile__media" aria-hidden="true" style="display:flex;align-items:flex-end;justify-content:center"><div style="width:34%;aspect-ratio:1/2;max-width:100%;border:2px solid var(--tile-dark-ink);border-bottom:0;border-radius:28px 28px 0 0;opacity:.6"></div></div>
  </section>
</div>
<script>document.querySelectorAll('a[href="#"]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()))</script>
