<!-- @dsCard height=288 -->
<style>
  .cv{position:relative;width:960px;height:288px;background:var(--surface);overflow:hidden}
  .cv svg{position:absolute;left:480px;top:0}
  .cv .brand{fill:var(--brand)} .cv .soft{fill:var(--brand-soft)} .cv .ink{fill:var(--ink)} .cv .alt{fill:var(--surface-alt)} .cv .surf{fill:var(--surface)} .cv .deep{fill:var(--brand-deep)}
  .cv__text{position:absolute;left:40px;bottom:40px;max-width:440px}
  .cv__name{margin:0;font-family:var(--font-sans);font-weight:800;font-size:120px;line-height:.92;letter-spacing:-4px;color:var(--ink)}
  .cv__name span{color:var(--brand)}
  .cv__tag{margin:12px 0 0;font-family:var(--font-sans);font-size:14px;line-height:20px;font-weight:500;color:var(--ink-secondary)}
</style>
<div class="cv">
  <svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
    <!-- blocks: brand 288x288 disc bleeding top/right (largest), brand-soft 192x96 pill, ink 120x120 radius-xl tile, surface-alt band
         arrangement: one big orange disc as the slab, satellites stacked left of it, bleeding off top and right
         pattern: pills and discs from radius-pill — the system is soft and friendly (every button, badge and chip is a pill)
         steps/radii: gaps space-5 24px, pills 48px tall (rx 24 = half), tile radius-xl 32px -->
    <rect class="alt" x="0" y="0" width="480" height="288"/>
    <circle class="brand" cx="352" cy="120" r="168"/>
    <rect class="ink" x="24" y="144" width="120" height="120" rx="32"/>
    <rect class="soft" x="24" y="24" width="192" height="96" rx="48"/>
    <rect class="surf" x="168" y="216" width="168" height="48" rx="24"/>
    <rect class="brand" x="168" y="168" width="48" height="24" rx="12"/>
    <rect class="deep" x="240" y="168" width="96" height="24" rx="12"/>
    <circle class="surf" cx="420" cy="252" r="24"/>
  </svg>
  <div class="cv__text">
    <h1 class="cv__name">Lumen<span>.</span></h1>
    <p class="cv__tag">Trắng thoáng, cam năng động, trẻ trung mỗi điểm chạm.</p>
  </div>
</div>
